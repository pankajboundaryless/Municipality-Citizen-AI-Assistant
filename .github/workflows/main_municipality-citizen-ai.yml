name: Build and deploy Python app to Azure Web App - municipality-citizen-ai

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for OIDC login
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Install deps inside Debian Bullseye container — same GLIBC as Azure
      # App Service Python 3.12, so compiled extensions (cryptography etc.)
      # are binary-compatible at runtime.
      - name: Install dependencies into package folder
        run: |
          docker run --rm \
            -v "$PWD:/app" \
            python:3.12-slim-bullseye \
            pip install -r /app/requirements.txt \
              --target /app/.python_packages/lib/site-packages \
              --no-cache-dir

      - name: Create deployment zip
        run: |
          zip -r release.zip . \
            -x "*.git*" \
            -x "*.github*" \
            -x "*__pycache__*" \
            -x "*.pyc" \
            -x "log.txt" \
            -x "citizen_sessions.db" \
            -x "*.env"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_27C5BB0D9ECE4F66A349DC15C1801619 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D2FCB18D3BE44CC1AFAF4F548D5E5D11 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B106316284A7402391ADBC57E20BBBC0 }}

      - name: Deploy zip to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'municipality-citizen-ai'
          slot-name: 'Production'
          package: release.zip
